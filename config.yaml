cluster:
  head_ip: "192.168.1.1"
  ray_port: 6379
  dashboard_port: 8265
  # 4 GB plasma store on head; workers use 2 GB (Jetson unified memory)
  object_store_memory_gb: 4
  jetson_ips:
    - "192.168.1.2"   # j001
    - "192.168.1.3"   # j002
    - "192.168.1.4"   # j003
    - "192.168.1.5"   # j004
  username: "nvidia"
  project_dir: "~/JetsonDistributedComp"
  # TCP port each Jetson inference_server.py listens on
  inference_port: 9100
  # Path to venv on the GPU PC head node
  head_venv_activate: "/home/cams/Desktop/Akshay/.venv_mmpose/bin/activate"

model:
  # Options: yolov8 | rtdetr | rtmpose
  type: "yolov8"
  # Path relative to project_dir; update once .pt/.pth files are available
  path: "models/yolov8n.pt"
  confidence: 0.5
  iou_threshold: 0.45
  img_size: 640
  warmup_iters: 3
  # RTMPose-specific: paths to det + pose models
  rtmpose:
    det_model_path: "models/rtmdet_nano.pth"
    pose_model_path: "models/rtmpose_s.pth"
    det_config: "configs/rtmdet_nano.py"
    pose_config: "configs/rtmpose_s.py"

pipeline:
  # Max concurrent frames queued to a single worker before backpressure kicks in
  max_in_flight_per_worker: 4
  # drop: silently drop frame | block: wait until a worker slot opens
  frame_drop_policy: "drop"
  max_queue_depth: 32
  # Number of out-of-order results to buffer before flushing in sequence
  result_reorder_buffer: 16

input:
  # File path or rtsp://host:port/path
  source: "test_video.mp4"
  # Cap source FPS to avoid flooding workers (0 = no cap)
  fps_cap: 30

output:
  display: true
  save_video: false
  output_path: "results/output.mp4"
  # {timestamp} is replaced at runtime with YYYYMMDD_HHMMSS
  csv_path: "results/metrics_{timestamp}.csv"
  # JSON log file for structured per-frame worker logs
  log_path: "results/worker_logs_{timestamp}.jsonl"

benchmark:
  num_frames: 300
  worker_counts: [1, 2, 4]
  # Frame index at which to kill worker 0 during fault injection test
  fault_inject_at_frame: 100
  results_dir: "results"

session:
  # Models used by jetson_pipeline.py
  rtdetr_model: "converted_models/RT-DETR_640.pt"
  rtmpose_model: "converted_models/rtmpose_homecage_best_size256.onnx"
  id_model: "converted_models/ID_model_ElmJok_Apr2026.onnx"
  # Monkey class names ordered by class ID (0=Elm, 1=Jok)
  monkey_names: ["Elm", "Jok"]
  # RTMPose model input size: width, height (size256 model requires square 256x256)
  rtmpose_input_size: [256, 256]
  # Detection confidence threshold
  detection_conf: 0.5
  # Process every Nth frame (1=all frames, 2=every other, etc.)
  skip_frames: 1
  results_dir: "results"
  # Video-to-Jetson assignments for run_session.yaml
  video_assignments:
    j001: "multi_camera_test_videos/Elm_Jok_manual_1_117_20250708170005_1min.mp4"
    j002: "multi_camera_test_videos/Elm_Jok_manual_1_108_20250708170005_1min.mp4"
    j003: "multi_camera_test_videos/Elm_Jok_manual_1_102_20250708170005_1min.mp4"
    j004: "multi_camera_test_videos/Elm_Jok_manual_1_113_20250708170005_1min.mp4"
